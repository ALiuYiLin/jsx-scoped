name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 允许 GitHub Pages 的 GITHUB_TOKEN 执行部署
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        # 版本单一来源：读取 package.json 的 packageManager（pnpm@11.22.0），
        # 不要在此重复指定 version，否则与 packageManager 不一致会报
        # ERR_PNPM_BAD_PM_VERSION
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.22.0（packageManager）要求 Node >= 22.13（用到 node:sqlite）
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix vitepress-react scoped css case aliases (Linux CI)
        # 见 .github/scripts/fix-scoped-css-case.mjs：vitepress-react alpha.22
        # 主题 import 用 PascalCase 的 *.scoped.css，而包内文件名为全小写，
        # Windows 无感、Linux(CI) 会 UNRESOLVED_IMPORT，这里补大小写副本
        run: node .github/scripts/fix-scoped-css-case.mjs
      - name: Build docs
        run: pnpm docs:build
        # 产物 base=/jsx-scoped/ 已在 docs/.vitepress-react/config.mts 配置
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
